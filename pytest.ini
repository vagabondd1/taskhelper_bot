[pytest]
testpaths = tests

# Корень проекта в sys.path: консольный скрипт pytest, в отличие от
# `python -m pytest`, рабочую директорию туда не кладёт — без этого
# не импортируется пакет app.
pythonpath = .

# auto — почти весь тестируемый код асинхронный, ручной @pytest.mark.asyncio
# на каждой функции был бы шумом в каждом файле.
asyncio_mode = auto

# Свой event loop на каждый тест: общий loop протекает состоянием между
# тестами (в т.ч. клиентами fakeredis) и даёт порядок-зависимые падения.
asyncio_default_fixture_loop_scope = function

addopts = -q --strict-markers
