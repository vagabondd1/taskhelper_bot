services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # entrypoint.sh делает `exec python main.py` → PID 1 становится python.
      # Без procps в slim-образе это самый дешёвый liveness-check.
      # Не «health» в полном смысле (не проверяет polling-цикл), но падает,
      # если python вылетел и контейнер замер на restart-цикле.
      test: ["CMD-SHELL", "grep -q python /proc/1/comm || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - task_helper_net

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    # Миграции применяет бот — здесь только uvicorn, чтобы избежать гонки.
    command: ["uvicorn", "app.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:8000/health').status==200 else sys.exit(1)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - task_helper_net

  # Прогон тестов: docker compose run --rm tests
  # profiles — чтобы сервис не поднимался вместе с обычным `docker compose up`.
  tests:
    build:
      context: .
      dockerfile: Dockerfile.test
    profiles: ["test"]
    volumes:
      - .:/app
    # Ни БД, ни Redis, ни LLM не нужны: зависимости замоканы, Redis подменён
    # на fakeredis. Поэтому ни depends_on, ни networks здесь нет.
    command: ["pytest"]

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - task_helper_net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - task_helper_net

volumes:
  postgres_data:

networks:
  task_helper_net:
    driver: bridge
